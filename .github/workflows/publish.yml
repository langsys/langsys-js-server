name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing (tokenless) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Re-run after the build so tests/build-output.test.ts actually executes. It guards
      # the `node:` import prefix, whose loss silently reduces this package from four
      # supported runtimes to two while every source-level test still passes.
      - run: npm test

      - run: npm publish --provenance
